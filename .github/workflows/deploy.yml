name: Build & Deploy Börrega

# Dispara el build + deploy del sitio Astro cuando:
#  - cada 6 horas, para levantar el contenido que publique la clienta (schedule)
#  - se corre manualmente desde la pestaña Actions (workflow_dispatch)
#  - se pushea un cambio del front (push a main dentro de borrega-astro/)
#  - WordPress avisa que se publico/edito contenido (repository_dispatch)
#
# El schedule es a proposito en vez de un webhook desde WordPress. Un webhook
# necesita un token de GitHub con `contents: write` guardado en la base de WP,
# y el riesgo no es el token: es la cadena. Si comprometen el WordPress
# (Elementor + ACF + plugins es blanco habitual), ese token da push al repo, y
# este repo deploya solo a produccion. El cron no necesita ninguna credencial
# nueva ni expone ningun endpoint.
#
# Costo en pedidos: `wp.ts` memoriza cada coleccion por build, asi que un build
# sin novedades son 4 pedidos a borregastudio.com. A 6 h son 16 pedidos por dia,
# muy lejos de despertar el anti-bots del hosting (que ya nos devolvio 403
# intermitente desde las IPs de Actions).
#
# repository_dispatch queda declarado pero nadie lo dispara hoy. Si algun dia se
# necesita publicacion instantanea, el camino seguro es una GitHub App con
# permiso minimo y secreto rotable, no un token personal dentro de WordPress.
on:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'borrega-astro/**'
      - '.github/workflows/deploy.yml'

# Los runs se encolan, no se cancelan. El deploy es un FTP archivo por archivo:
# cancelarlo a mitad de la subida deja HTML nuevo apuntando a assets hasheados
# que todavia no llegaron, o sea el sitio roto hasta el run siguiente. Encolar
# cuesta unos minutos de espera y no tiene esa ventana.
concurrency:
  group: deploy-borrega
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: borrega-astro/package-lock.json

      # Las imagenes remotas ya optimizadas se guardan fuera de node_modules
      # (ver cacheDir en astro.config.mjs) para que sobrevivan al npm ci.
      # Clave rodante: restaura la mas reciente y guarda una nueva en cada
      # corrida, asi acompaña a las imagenes que vaya subiendo la clienta.
      - name: Cache de imagenes optimizadas
        uses: actions/cache@v4
        with:
          path: borrega-astro/.astro-cache
          key: astro-cache-${{ github.run_id }}
          restore-keys: astro-cache-

      - name: Instalar dependencias
        working-directory: borrega-astro
        run: npm ci

      - name: Build (trae el contenido en vivo de WordPress)
        working-directory: borrega-astro
        run: npm run build
        env:
          WP_BASE_URL: https://www.borregastudio.com

      - name: Deploy a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: borrega-astro/dist/
          protocol: ftps
          port: 21
